<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Te amo</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #05000c;
    overflow: hidden;
}

canvas {
    display: block;
}

h1 {
    position: absolute;
    top: 12%;
    width: 100%;
    text-align: center;
    color: #ff4d88;
    font-family: Arial, sans-serif;
    font-size: 22px;
    letter-spacing: 4px;
    text-shadow: 0 0 15px #ff0055;
}
</style>
</head>

<body>


<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width, height;
let particles = [];
let targets = [];
let animationStarted = false;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;

    createHeart();
}

function createHeart() {
    targets = [];
    particles = [];

    const scale = Math.min(width, height) / 36;
    const cx = width / 2;
    const cy = height / 2;

    // Crear los puntos del corazón
    for (let i = 0; i < 1000; i++) {
        const t = Math.random() * Math.PI * 2;

        const hx = 16 * Math.pow(Math.sin(t), 3);

        const hy =
            13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t);

        const fill = Math.sqrt(Math.random());

        targets.push({
            x: cx + hx * scale * fill,
            y: cy - hy * scale * fill
        });
    }

    // Los puntos comienzan en lugares aleatorios
    particles = targets.map((target) => ({
        x: Math.random() * width,
        y: Math.random() * height,
        targetX: target.x,
        targetY: target.y,
        size: Math.random() * 1.8 + 1,
        speed: Math.random() * 0.018 + 0.012,
        color: Math.random() > 0.35
            ? "#ff176b"
            : "#ff9cce"
    }));

    animationStarted = true;
}

function animate() {
    requestAnimationFrame(animate);

    // Fondo oscuro con un pequeño rastro de movimiento
    ctx.fillStyle = "rgba(5, 0, 12, 0.25)";
    ctx.fillRect(0, 0, width, height);

    particles.forEach((p) => {
        const dx = p.targetX - p.x;
        const dy = p.targetY - p.y;

        // Los puntos se organizan hasta formar el corazón
        if (Math.abs(dx) > 0.15 || Math.abs(dy) > 0.15) {
            p.x += dx * p.speed;
            p.y += dy * p.speed;
        } else {
            p.x = p.targetX;
            p.y = p.targetY;
        }

        // Dibujar cada partícula
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = p.color;
        ctx.fill();
    });

    ctx.shadowBlur = 0;
}

window.addEventListener("resize", resize);

resize();
animate();
</script>

</body>
</html>
